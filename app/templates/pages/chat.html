<link rel="stylesheet" href="/assets/css/styles.css">

<body>
    <script src="/assets/js/chats/sendChat.js" defer></script>
    <script src="/assets/js/ui/addCharacterToChat.js" defer></script>
    <script src="/assets/js/ui/selectLoadoutInChat.js" defer></script>
    <script src="/assets/js/ui/toast.js" defer></script>
    <script src="/assets/js/chats/editMessage.js" defer></script>
    <script src="/assets/js/chats/chatTidbits.js" defer></script>
    <div class="convo-page">
        <div class="layout">
             <div class="left">
                <header id="chats-header">Chats</header>
                <div id="chat-cards">
                    <div class="active-chat-pane">
                        {{CHAT_CARDS}}
                    </div>
                </div>
            </div>
            <div class="middle">
                <div class="convo-pane">
                    <div class="convo-head">
                        <div class="convo-title-group">
                            <header id="convo-title">{{CHAT_TITLE}}</header>

                            <button class="convo-title-edit-button" type="button" aria-label="Edit conversation title">
                                <img class="convo-title-edit-icon" src="/assets/icons/pencil.svg" alt="">
                            </button>
                        </div>
                        <div class="convo-head-imgs">
                            <button class="convo-head-add" type="button" aria-label="Add character" onclick="addCharacterToChat()">
                                <svg class="convo-head-add-icon" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 5v14M5 12h14" />
                                </svg>
                            </button>
                            <button class="convo-head-x hidden" type="button" aria-label="Remove character" onclick="continueConvoWithCharacters()">
                                <svg class="convo-head-x-icon" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M6 6l12 12M18 6L6 18" />
                                </svg>
                            </button>
                            {{CONVO_HEAD_CHARACTERS}}
                        </div>
                        <div class="pipeline-bubble" data-bubble-loadout-id="{{LOADOUT_ID}}">
                            <button class="loadout-configuration-button" type="button" onclick="openLoadoutSelection()">
                                {{LOADOUT_NAME}}
                            </button>

                            <button class="loadout-selection-x" type="button" aria-label="Close loadout selection" onclick="closeLoadoutSelection()">
                                <svg class="convo-head-x-icon" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M6 6l12 12M18 6L6 18" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="chat-window">
                        <div class="chat-bubbles">
                            {{CONVO_MESSAGES}}
                        </div>
                    </div>
                    <form class="chat-input-bar" id="chat-message-form">
                        <textarea
                            class="chat-input"
                            id="chatMessageInput"
                            name="chatMessageInput"
                            placeholder="Type a message..."
                        ></textarea>

                        <button class="chat-send-button" type="submit" aria-label="Send message">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5 12 H18 M13 7 L18 12 L13 17" />
                            </svg>
                        </button>
                    </form>
                </div>
                <div id="character-cards" class="chat-character-picker">
                    {{CHARACTER_CARDS}}
                </div>
                <div id="loadout-cards" class="chat-loadout-picker">
                    {{LOADOUT_CARDS}}
                </div>
            </div>
            <div class="right">inshallah there will be a right sidebar here</div>
        </div>
    </div>
</body>
